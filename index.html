<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>1v1 Tetris Mobile</title>
<style>
  body {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    margin: 0;
  }
  canvas {
    border: 0px;
    touch-action: none; /* 모바일 터치 기본 동작 방지 */
  }
  .controls {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 650px;
    margin-top: 10px;
  }
  .player-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-gap: 5px;
    margin-top: 5px;
  }
  button {
    width: 60px;
    height: 60px;
    font-size: 18px;
    border-radius: 10px;
    background: #eee;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
  <div class="player-controls" id="controls-p1">
    <div>P1</div>
    <div class="buttons">
      <button data-action="left">◀</button>
      <button data-action="rotate">⟳</button>
      <button data-action="right">▶</button>
      <button data-action="down">▼</button>
      <button data-action="drop">⬇</button>
    </div>
  </div>
  <div class="player-controls" id="controls-p2">
    <div>P2</div>
    <div class="buttons">
      <button data-action="left">◀</button>
      <button data-action="rotate">⟳</button>
      <button data-action="right">▶</button>
      <button data-action="down">▼</button>
      <button data-action="drop">⬇</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 모바일 화면 크기에 맞게 조절
const SCALE = Math.floor(Math.min(window.innerWidth/32, window.innerHeight/22));
canvas.width = SCALE*32; // 2 플레이어: 16 + 16
canvas.height = SCALE*22;
ctx.scale(SCALE, SCALE);

// --- 기존 게임 로직 그대로 ---
// COLORS_P1, COLORS_P2, SHAPES, matrix(), createPlayer(), p1/p2 초기화 등
// ... (여기까지는 기존 코드 동일)

// --- 터치 버튼 이벤트 처리 ---
function bindControls(player, containerId){
  const container = document.getElementById(containerId);
  container.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("touchstart", e=>{
      e.preventDefault();
      const action = btn.dataset.action;
      if(action==="left"){ player.pos.x--; if(collide(player)) player.pos.x++; }
      if(action==="right"){ player.pos.x++; if(collide(player)) player.pos.x--; }
      if(action==="down"){ drop(player); }
      if(action==="rotate"){ const m = player.matrix; player.matrix = rotate(m); if(collide(player)) player.matrix=m; }
      if(action==="drop"){ hardDrop(player); }
    });
  });
}

bindControls(p1, "controls-p1");
bindControls(p2, "controls-p2");

// --- 게임 루프와 나머지 로직 그대로 ---
// update(), drawMatrix(), drawGhost(), drawBoardOutline(), drawUI() 등 기존 그대로

// 마지막 초기화
p1.next=randomPiece(); p2.next=randomPiece();
resetPlayer(p1); resetPlayer(p2);
update();
</script>

</body>
</html>
